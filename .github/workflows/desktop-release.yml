name: Build and Publish Desktop Release

# Versiones del PC (KevMusic Desktop): tags desktop-vX.Y.Z, independientes de las v* de Android
on:
  push:
    tags:
      - 'desktop-v*'
  # Compilación de prueba (sin publicar release): los paquetes quedan como artefactos de la ejecución
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build .deb
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: desktop/*.gradle.kts

      - name: Check version matches tag
        id: version
        run: |
          FILE_VERSION=$(grep -m1 -oP '^version = "\K[^"]+' build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#desktop-v}"
          else
            TAG="desktop-v$FILE_VERSION"
            VERSION="$FILE_VERSION"
          fi
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "El tag $TAG no coincide con version = \"$FILE_VERSION\" en desktop/build.gradle.kts"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # xvfb: cds-train.sh abre la app unos segundos en una pantalla virtual para generar el archivo AppCDS
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build .deb and portable bundle
        run: |
          chmod +x gradlew cds-train.sh
          ./gradlew packageDeb createDistributable --no-daemon
          DEB=$(find build/compose/binaries/main/deb -name "*.deb" | head -n 1)
          ./cds-train.sh "$DEB"
          ./cds-train.sh build/compose/binaries/main/app/kevmusic-desktop
          cp "$DEB" "../kevmusic-desktop_${{ steps.version.outputs.version }}_amd64.deb"
          tar -C build/compose/binaries/main/app -czf "../kevmusic-desktop-${{ steps.version.outputs.version }}-linux-x64.tar.gz" kevmusic-desktop

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            kevmusic-desktop_${{ steps.version.outputs.version }}_amd64.deb
            kevmusic-desktop-${{ steps.version.outputs.version }}-linux-x64.tar.gz

  # jpackage solo genera paquetes del sistema en el que corre: el .msi necesita un runner de Windows
  build-windows:
    name: Build .msi
    runs-on: windows-latest
    needs: build-linux
    defaults:
      run:
        working-directory: desktop
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: desktop/*.gradle.kts

      # Sin firma de código: SmartScreen avisa ("Más información" → "Ejecutar de todas formas")
      - name: Build .msi and portable bundle
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          ./gradlew packageMsi createDistributable --no-daemon
          MSI=$(find build/compose/binaries/main/msi -name "*.msi" | head -n 1)
          cp "$MSI" "../kevmusic-desktop-${VERSION}-windows-x64.msi"
          cd build/compose/binaries/main/app
          7z a -tzip "$GITHUB_WORKSPACE/kevmusic-desktop-${VERSION}-windows-x64.zip" kevmusic-desktop

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            kevmusic-desktop-${{ needs.build-linux.outputs.version }}-windows-x64.msi
            kevmusic-desktop-${{ needs.build-linux.outputs.version }}-windows-x64.zip

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Locate Release Notes
        id: notes
        run: |
          NOTES="changelog/${{ needs.build-linux.outputs.tag }}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      # make_latest=false: la app Android busca su actualización en /releases/latest y no debe ver estas
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: KevMusic Desktop ${{ needs.build-linux.outputs.version }}
          tag_name: ${{ needs.build-linux.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          make_latest: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
