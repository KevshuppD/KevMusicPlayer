# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Djava.awt.headless=true -XX:+UseParallelGC -Dcom.android.tools.r8.maxNumberOfThreads=8
kotlin.daemon.jvmargs=-Djava.awt.headless=true -Xmx2048m

# Performance Optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true

# Kotlin & KSP Incremental Compilation Speedups
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.caching.enabled=true
ksp.incremental=true
ksp.incremental.intermodule=true

# Android Gradle Plugin Build Speedups
android.nonTransitiveRClass=true
android.nonFinalResIds=true
